<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resolve Loop · AI Support Operating Model Emulator</title>
<meta name="description" content="Interactive emulator of an AI-augmented global payroll support operating model: AI triage, telemetry investigation, governed human approval, knowledge capture and a 30/60/90-day Head of Support plan." />
<style>
:root{color-scheme:dark;--bg:#12161c;--panel:#1a2029;--line:#2b3441;--ink:#e8ecf1;--mute:#98a3b3;--acc:#7aa7ff;--warn:#e8b04a;--ok:#6fcf97;--bad:#ef7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;font-weight:600;margin:0 0 .4em;line-height:1.2}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.05rem}
header{padding:1.5rem clamp(1rem,4vw,3rem) .5rem;max-width:1100px;margin:auto}
header p{color:var(--mute);max-width:62ch;margin:.3rem 0 0}
nav{display:flex;gap:.4rem;flex-wrap:wrap;padding:.8rem clamp(1rem,4vw,3rem);max-width:1100px;margin:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:1px solid var(--line);color:var(--mute);padding:.4rem .8rem;border-radius:6px;cursor:pointer;font:inherit}
nav button[aria-current=true]{background:var(--acc);color:#0c1220;border-color:var(--acc);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:1.2rem clamp(1rem,4vw,3rem) 3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem}
.card button.go{margin-top:.6rem;background:none;border:0;color:var(--acc);cursor:pointer;padding:0;font:inherit}
.kpi{display:flex;gap:1.2rem;margin:.5rem 0}.kpi b{display:block;font-size:1.3rem}.kpi span{color:var(--mute);font-size:.8rem}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:.85rem}
tr.sel{background:#202938}tr[data-i]{cursor:pointer}
.tag{display:inline-block;padding:.05rem .5rem;border-radius:99px;border:1px solid var(--line);font-size:.8rem}
.sev3{color:var(--bad);border-color:var(--bad)}.sev2{color:var(--warn);border-color:var(--warn)}.sev1{color:var(--ok);border-color:var(--ok)}
pre{background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:.8rem;overflow-x:auto;font-size:.82rem;margin:.5rem 0;color:#c9d4e3}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin:.5rem 0}
.note{color:var(--mute);font-size:.88rem}.sim{color:var(--warn);font-size:.78rem}
.btn{background:var(--acc);color:#0c1220;border:0;border-radius:6px;padding:.45rem .9rem;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--acc)}
.scroll{overflow-x:auto}
footer{text-align:center;color:var(--mute);font-size:.82rem;padding:1.5rem}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<header>
<h1>Resolve Loop</h1>
<p>An interactive model of how I would run a global payroll technical support organisation in an AI-first way: faster decisions, governed autonomy, and every resolved case feeding the next one.</p>
</header>
<nav id="nav" aria-label="Modules"></nav>
<main id="view" tabindex="-1"></main>
<footer>Illustrative simulation. All data and AI outputs are fictional.</footer>

<script>
const $=s=>document.querySelector(s);
const tickets=[
{id:"T-1041",t:"Pay run failed for Brazil entity",c:"Payments",sev:3,tier:"Payment Services",reg:"Americas",conf:94,sla:2,ai:"Bank file rejected: invalid CNPJ format. Matches 3 prior cases."},
{id:"T-1042",t:"UK tax code mismatch on 12 employees",c:"Compliance",sev:2,tier:"Tier 2",reg:"EMEA",conf:81,sla:6,ai:"Tax code sync lag after HMRC update. Re-sync proposed."},
{id:"T-1043",t:"How do I add a new cost centre?",c:"How-to",sev:1,tier:"Tier 1",reg:"India",conf:98,sla:24,ai:"Answered from KB-212. Eligible for self-service deflection."},
{id:"T-1044",t:"Webhook not firing for approved timesheets",c:"Integration/API",sev:2,tier:"Tier 2",reg:"India",conf:67,sla:8,ai:"Low confidence: possible retry-queue backlog. Routed to human."},
{id:"T-1045",t:"FX payout delayed to Philippines",c:"Payments",sev:3,tier:"Payment Services",reg:"EMEA",conf:72,sla:3,ai:"Partner bank cut-off missed. Needs human approval before any retry."}];
const logs={
"T-1041":["09:02:11 payrun-svc ERROR bank_file validation failed field=CNPJ","09:02:11 payrun-svc WARN retry 1/3 skipped (non-retryable)","09:02:12 notify-svc INFO alert sent to payments-oncall"],
"T-1042":["08:40:03 tax-svc WARN code S1257L not in cache","08:40:03 tax-svc INFO cache refresh deferred (job lag 38m)"],
"T-1043":["10:11:20 kb-svc INFO match KB-212 score=0.97"],
"T-1044":["11:30:44 hook-svc ERROR 503 from consumer endpoint","11:30:44 queue-svc WARN retry depth=1840 (threshold 500)","11:31:02 hook-svc INFO backoff 64s"],
"T-1045":["07:55:09 payout-svc WARN partner cut-off 06:00Z missed","07:55:10 payout-svc INFO status=HELD awaiting approval"]};
const sql={"T-1041":"SELECT entity_id, field, value FROM bank_file_errors\nWHERE run_id = 'R-8812';\n-- 41 rows: all CNPJ missing check digits",
"T-1042":"SELECT code, COUNT(*) FROM employee_tax\nWHERE sync_status='STALE' GROUP BY code;\n-- S1257L: 12 rows",
"T-1043":"-- No query needed","T-1044":"SELECT status, COUNT(*) FROM webhook_events\nWHERE type='timesheet.approved' GROUP BY status;\n-- PENDING_RETRY: 1840",
"T-1045":"SELECT payout_id, status FROM payouts\nWHERE country='PH' AND status='HELD';\n-- 27 payouts held"};
const actions=[["Draft reply to customer",1,"Suggests"],["Re-sync tax tables",2,"Acts with approval"],["Retry failed webhook queue",2,"Acts with approval"],["Publish KB article",2,"Acts with approval"],["Tag and route Tier 1 how-to",3,"Acts alone"],["Retry or release a payment",1,"Human only"],["Change employee pay data",1,"Human only"]];
const issues=[["Bank file validation errors (LATAM)",212,"Product: field validation at entry","In build",-60],["Tax sync lag after statutory updates",148,"R&D: refresh job priority","Planned",-45],["Webhook retry queue backlog",96,"R&D: autoscaling consumers","Investigating",-70],["Confusing cost centre setup",74,"Product: guided setup","Backlog",-50]];
const plan=[["Days 1-30: Learn",["Review SLA, backlog and reopen data by region and tier","Shadow escalations with R&D and Product","Baseline deflection AND confirmed resolution","Map skills of every Tier 1, Tier 2 and Payment Services agent"]],
["Days 31-60: Stabilise",["Fix shift coverage gaps across India, EMEA and Americas","Launch weekly root-cause review with R&D","Define the approval matrix for AI actions","Standard case documentation template"]],
["Days 61-90: Scale",["Roll out AI triage with a human-in-the-loop on payments","Turn top 20 resolved cases into KB and self-service content","Publish roadmap asks ranked by case reduction","Start domain-expert career path"]]];
const maps=[["strategy","Leadership & strategy","Support strategy tied to the product roadmap","3 phases","30/60/90"],["ops","Operational excellence","SLAs, shifts and repeat cases under control","SLA 94%","Repeat 11%"],["tech","Technical escalations","Logs, SQL and API traces to a root cause","MTTR 3.1h","Tier 2 backlog 18"],["roadmap","Cross-functional","Root causes turned into R&D and Product work","4 asks","-60% cases"],["kb","Knowledge & CX","Every case becomes an article or self-service","Defl. 58%","Resolved 41%"],["gov","AI-first operations","Autonomy with human approval where risk is high","7 actions","Full audit"]];
const S={tab:"home",tick:0,log:[],audit:[],kb:{drafted:false,reviewed:false,pub:false}};
const tabs=[["home","Overview"],["triage","Triage"],["tech","Investigate"],["gov","Governance"],["kb","Knowledge"],["ops","Ops"],["roadmap","Roadmap"],["strategy","30/60/90"],["sim","What-if"]];
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const sev=n=>`<span class="tag sev${n}">${["","Low","Medium","High"][n]}</span>`;

function nav(){const n=$("#nav");n.innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" aria-current="${S.tab===k||(S.tab==="kb"&&k==="kb")}">${l}</button>`).join("");
n.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t));}
function go(t){S.tab=t;location.hash=t;render();$("#view").focus({preventScroll:true});}
function render(){nav();const v=$("#view");v.innerHTML=({home,triage,tech,gov,kb,ops,roadmap,strategy,sim}[S.tab]||home)();bind();}

function home(){return `<h2>The mandate at a glance</h2><p class="note">Six areas a Head of Support owns. Open each to see how I would run it.</p><div class="grid">`+
maps.map(m=>`<div class="card"><h3>${m[1]}</h3><p>${m[2]}</p><div class="kpi"><div><b>${m[3]}</b><span>simulated</span></div><div><b>${m[4]}</b><span>simulated</span></div></div><button class="go" data-t="${m[0]}">Open module</button></div>`).join("")+`</div>`;}

function triage(){const t=tickets;return `<h2>AI triage</h2><p class="note">Select a ticket. Anything under 80% confidence, and every payment action, goes to a human.</p><div class="scroll"><table><tr><th>Ticket</th><th>Category</th><th>Severity</th><th>Route</th><th>Confidence</th><th>SLA left</th></tr>`+
t.map((x,i)=>`<tr data-i="${i}" class="${i===S.tick?"sel":""}"><td>${x.id}<br>${esc(x.t)}</td><td>${x.c}</td><td>${sev(x.sev)}</td><td>${x.tier}<br><span class="note">${x.reg}</span></td><td>${x.conf}%<div class="bar"><i style="width:${x.conf}%"></i></div></td><td>${x.sla}h</td></tr>`).join("")+
`</table></div><div class="card" style="margin-top:1rem"><h3>AI summary <span class="sim">Simulated</span></h3><p>${esc(t[S.tick].ai)}</p><p class="note">${t[S.tick].conf<80||t[S.tick].c==="Payments"?"Routed to a human reviewer.":"Eligible for automated handling."}</p></div>`;}

function tech(){const x=tickets[S.tick];return `<h2>Investigation workbench</h2><div class="row"><label>Ticket <select id="tsel">${tickets.map((y,i)=>`<option value="${i}" ${i===S.tick?"selected":""}>${y.id} ${esc(y.t)}</option>`).join("")}</select></label></div>
<div class="grid"><div class="card"><h3>Logs <span class="sim">Simulated</span></h3><pre>${logs[x.id].map(esc).join("\n")}</pre></div><div class="card"><h3>Read-only SQL <span class="sim">Simulated</span></h3><pre>${esc(sql[x.id])}</pre></div></div>
<div class="card" style="margin-top:1rem"><h3>Method</h3><p>Reproduce, isolate the service, confirm the cause in data, propose a fix, then record it for the knowledge base.</p><p class="note">Proposed: ${esc(x.ai)}</p></div>`;}

function gov(){return `<h2>Governed autonomy</h2><p class="note">Choose what happens, and see who is allowed to do it.</p><div class="scroll"><table><tr><th>Action</th><th>Autonomy level</th><th></th></tr>`+
actions.map((a,i)=>`<tr><td>${a[0]}</td><td><span class="tag">${a[2]}</span></td><td><button class="btn alt" data-a="${i}">${a[1]===1?"Request":a[1]===2?"Approve and run":"Run"}</button></td></tr>`).join("")+
`</table></div><div class="card" style="margin-top:1rem"><h3>Audit trail</h3>${S.audit.length?S.audit.map(l=>`<div class="note">${esc(l)}</div>`).join(""):'<p class="note">No actions yet. Run one above.</p>'}</div>`;}

function kb(){const k=S.kb;return `<h2>Knowledge loop</h2><p class="note">A resolved case becomes an article, then self-service. Humans review before it goes live.</p><div class="card"><h3>Case T-1041 to KB article</h3>
<p>1. Resolved case ${k.drafted?"✓":""}<br>2. AI draft ${k.reviewed?"✓":""}<br>3. Human review ${k.pub?"✓":""}<br>4. Published</p>
<button class="btn" id="kbn">${!k.drafted?"Draft article":!k.reviewed?"Approve as reviewer":!k.pub?"Publish":"Reset"}</button></div>
<div class="grid" style="margin-top:1rem"><div class="card"><h3>Deflection <span class="sim">Simulated</span></h3><b style="font-size:1.6rem">58%</b><div class="bar"><i style="width:58%"></i></div></div><div class="card"><h3>Confirmed resolution <span class="sim">Simulated</span></h3><b style="font-size:1.6rem">41%</b><div class="bar"><i style="width:41%"></i></div></div></div>
<p class="note">A customer leaving the chat does not prove the problem was solved. I track both and manage to the second.</p>`;}

function ops(){const reg=[["India",88],["EMEA",76],["Americas",64]];return `<h2>Operations command centre</h2><div class="grid">`+
[["SLA attainment","94%"],["Open backlog","132"],["Escalation rate","9%"],["Repeat-case rate","11%"],["Quality score","91"]].map(([a,b])=>`<div class="card"><span class="note">${a}</span><b style="display:block;font-size:1.6rem">${b}</b><span class="sim">Simulated</span></div>`).join("")+
`</div><div class="card" style="margin-top:1rem"><h3>Shift coverage by region</h3>${reg.map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}%</span></div><div class="bar"><i style="width:${r[1]}%"></i></div>`).join("")}<p class="note">Americas is the gap to close first.</p></div>
<button class="btn" id="rep" style="margin-top:1rem">Generate weekly report</button><pre id="repout" hidden></pre>`;}

function roadmap(){return `<h2>Root cause to roadmap</h2><div class="scroll"><table><tr><th>Recurring issue</th><th>Cases / qtr</th><th>Ask</th><th>Status</th><th>Expected change</th></tr>`+
issues.map(i=>`<tr><td>${i[0]}</td><td>${i[1]}</td><td>${i[2]}</td><td><span class="tag">${i[3]}</span></td><td>${i[4]}%</td></tr>`).join("")+`</table></div><p class="note">Ranked by volume and customer impact, so Product and R&D see the cases avoided, not just the complaints.</p>`;}

function strategy(){return `<h2>30/60/90-day plan</h2><div class="grid">`+plan.map(p=>`<div class="card"><h3>${p[0]}</h3><ul>${p[1].map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")+`</div>`;}

function sim(){const s=S.sim||(S.sim={d:58,h:40,a:30,e:9});const cost=(100-s.d*.6-s.a*.3)*s.h/100*12;const sla=Math.min(99,Math.round(78+s.h*.1+s.a*.15+s.d*.12-s.e*.8));
const csat=Math.min(98,Math.round(70+s.d*.1+s.a*.1+s.h*.1-s.e*.5));
return `<h2>What-if simulator</h2><p class="note">Illustrative model, not a forecast.</p><div class="grid">`+
[["d","AI deflection %",0,90],["h","Agents",10,80],["a","Automation coverage %",0,80],["e","Escalation rate %",2,25]].map(([k,l,a,b])=>`<div class="card"><label>${l}: <b id="v${k}">${s[k]}</b><input type="range" id="r${k}" min="${a}" max="${b}" value="${s[k]}"></label></div>`).join("")+
`</div><div class="grid" style="margin-top:1rem"><div class="card"><span class="note">Monthly cost index</span><b id="oc" style="display:block;font-size:1.6rem">${cost.toFixed(0)}</b></div><div class="card"><span class="note">SLA attainment</span><b id="os" style="display:block;font-size:1.6rem">${sla}%</b></div><div class="card"><span class="note">CSAT</span><b id="oq" style="display:block;font-size:1.6rem">${csat}</b></div></div>`;}

function bind(){const v=$("#view");
v.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go(b.dataset.t));
v.querySelectorAll("tr[data-i]").forEach(r=>r.onclick=()=>{S.tick=+r.dataset.i;render();});
const ts=$("#tsel");if(ts)ts.onchange=()=>{S.tick=+ts.value;render();};
v.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=actions[+b.dataset.a];
S.audit.unshift(`${new Date().toLocaleTimeString()} ${a[0]}: ${a[1]===1?"human decision required, request logged":a[1]===2?"approved by human, executed":"executed automatically, logged"}`);render();});
const kn=$("#kbn");if(kn)kn.onclick=()=>{const k=S.kb;if(!k.drafted)k.drafted=true;else if(!k.reviewed)k.reviewed=true;else if(!k.pub)k.pub=true;else S.kb={drafted:false,reviewed:false,pub:false};render();};
const rp=$("#rep");if(rp)rp.onclick=()=>{const o=$("#repout");o.hidden=false;o.textContent="Weekly support report (simulated)\nSLA 94% (+1pt). Backlog 132 (-9). Escalations 9%.\nTop driver: LATAM bank file errors, 212 cases.\nAsk to R&D: field validation at entry.\nRisk: Americas night-shift coverage at 64%.";};
if(S.tab==="sim"){const s=S.sim;["d","h","a","e"].forEach(k=>{$("#r"+k).oninput=e=>{s[k]=+e.target.value;$("#v"+k).textContent=s[k];
const cost=(100-s.d*.6-s.a*.3)*s.h/100*12;$("#oc").textContent=cost.toFixed(0);
$("#os").textContent=Math.min(99,Math.round(78+s.h*.1+s.a*.15+s.d*.12-s.e*.8))+"%";
$("#oq").textContent=Math.min(98,Math.round(70+s.d*.1+s.a*.1+s.h*.1-s.e*.5));};});}}
const h=location.hash.slice(1);if(tabs.some(t=>t[0]===h))S.tab=h;
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(tabs.some(t=>t[0]===h)&&h!==S.tab){S.tab=h;render();}});
render();
</script>
</body>
</html>
